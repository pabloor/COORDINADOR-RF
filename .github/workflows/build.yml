name: Compilar app

on:
  workflow_dispatch:
    inputs:
      version:
        description: "Publicar una release con esta etiqueta (por ejemplo v1.5). Vacío = solo compilar."
        required: false
        default: ""
  push:
    tags: ["v*"]
    branches: ["claude/**"]

permissions:
  contents: write

env:
  HIDDEN: "--paths ad600 --hidden-import ad600_bridge --hidden-import ad600_console --hidden-import ad600_discovery --hidden-import ad600_engine --hidden-import ad600_native --hidden-import paths"
  TAG: ${{ inputs.version || (startsWith(github.ref, 'refs/tags/v') && github.ref_name) || '' }}

jobs:
  mac:
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, suffix: "" }          # Mac con chip de Apple (M1, M2…)
          - { runner: macos-15-intel, suffix: "-Intel" }  # Mac con procesador Intel
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt
      - name: Compilar Coordinador RF.app
        env:
          MAC_CERT_P12: ${{ secrets.MAC_CERT_P12 }}
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          pyinstaller --noconfirm --windowed --name "Coordinador RF" \
            --icon mac/icono.icns \
            --osx-bundle-identifier local.coordinador-rf \
            --add-data "coordinador-rf.html:." --add-data "mac/icono.png:." \
            $HIDDEN \
            puente-rf.py
          # Prueba: el motor del AD600 se lanza como subproceso de la propia app. Debe ejecutar su consola y salir.
          mkdir -p smoke && perl -e 'alarm shift; exec @ARGV' 90 \
            "dist/Coordinador RF.app/Contents/MacOS/Coordinador RF" -u /x/ad600_console.py 3 smoke/cmd.txt smoke/out.log | tee smoke/stdout.txt
          grep -q "ad600_console" smoke/stdout.txt
          # Firma sin pagar cuenta de desarrollador: con el certificado propio (secretos MAC_CERT_P12 y MAC_CERT_PASSWORD) la identidad
          # es la misma en todas las versiones y macOS conserva los permisos; sin él, firma ad hoc.
          bash mac/firmar.sh "dist/Coordinador RF.app"
          ditto -c -k --keepParent "dist/Coordinador RF.app" "Coordinador-RF-Mac${{ matrix.suffix }}.zip"
      - uses: actions/upload-artifact@v4
        with:
          name: Coordinador-RF-Mac${{ matrix.suffix }}
          path: Coordinador-RF-Mac${{ matrix.suffix }}.zip
      - if: env.TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          files: Coordinador-RF-Mac${{ matrix.suffix }}.zip
          tag_name: ${{ env.TAG }}
          name: Coordinador RF ${{ env.TAG }}
          body_path: .github/release-notes.md

  probar-firma:
    runs-on: macos-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - run: bash tests/firma_mac.sh

  probar-actualizacion:
    # Actualización completa sobre la app real: descarga manipulada rechazada y actualización buena (ver tests/updater_mac.sh)
    needs: mac
    strategy:
      fail-fast: false
      matrix:
        include:
          - { runner: macos-latest, suffix: "" }
          - { runner: macos-15-intel, suffix: "-Intel" }
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with: { name: "Coordinador-RF-Mac${{ matrix.suffix }}" }
      - run: bash tests/updater_mac.sh "Coordinador-RF-Mac${{ matrix.suffix }}.zip"

  windows:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install -r requirements.txt pillow
      - name: Compilar Coordinador RF.exe
        shell: bash
        run: |
          python -c "from PIL import Image; Image.open('mac/icono.png').save('icono.ico', sizes=[(256,256),(64,64),(32,32),(16,16)])"
          pyinstaller --noconfirm --onefile --windowed --name "Coordinador RF" \
            --icon icono.ico \
            --add-data "coordinador-rf.html;." --add-data "mac/icono.png;." \
            $HIDDEN \
            puente-rf.py
      - uses: actions/upload-artifact@v4
        with: { name: Coordinador-RF-Windows, path: "dist/Coordinador RF.exe" }
      - if: env.TAG != ''
        uses: softprops/action-gh-release@v2
        with:
          files: "dist/Coordinador RF.exe"
          tag_name: ${{ env.TAG }}
          name: Coordinador RF ${{ env.TAG }}
          body_path: .github/release-notes.md
