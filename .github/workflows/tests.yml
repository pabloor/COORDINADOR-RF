name: Pruebas

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12" }
      - run: pip install pyserial playwright
      - run: python -m playwright install --with-deps chromium
      - name: Pruebas de extremo a extremo (puente real, receptores demo y AD600 simulado)
        run: python tests/e2e.py
